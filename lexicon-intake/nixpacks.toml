# Nixpacks configuration for Railway deployment
providers = ["python"]

[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
cmds = ["python3.12 -m pip install -e ."]

[start]
cmd = "python3.12 -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"

[variables]
PYTHON_VERSION = "3.12"
NIXPACKS_PYTHON_VERSION = "3.12"
